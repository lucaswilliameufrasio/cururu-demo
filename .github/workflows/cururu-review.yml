name: Cururu PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  gate:
    # Validates comment commands without joining the concurrency group, so
    # unrelated, mis-cased or unauthorized comments never cancel a review.
    # Cururu still checks the commenter's write permission itself.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (
        (github.event_name == 'pull_request_target' && github.event.action != 'closed' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      run: ${{ steps.command.outputs.run }}
    steps:
      - name: Accept PR events and exact commands from collaborators
        id: command
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          run=false
          if [ "$EVENT" = "pull_request_target" ]; then
            run=true
          else
            body="$(printf '%s' "$BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "$ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR)
                if [ "$body" = "/cururu review" ] || [ "$body" = "/cururu review --full" ]; then
                  run=true
                fi
                ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  discard-pending:
    # A closed or merged PR has nothing left to publish. Joining the review
    # group cancels a review or publication still waiting for approval, which
    # would otherwise stay pending until GitHub drops it after 30 days.
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    concurrency:
      group: cururu-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Discard pending Cururu work for the closed PR
        run: echo "Cancelled any Cururu review or publication still pending for this PR."

  review:
    # Draft PRs are reviewed on ready_for_review, not on each draft push.
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Only validated events reach this group; a newer review cancels an older one.
    concurrency:
      group: cururu-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Includes up to 12 minutes waiting for the Analyzers workflow.
    timeout-minutes: 25
    outputs:
      review_status: ${{ steps.review.outputs.review_status }}
      candidate_digest: ${{ steps.review.outputs.candidate_digest }}
      candidate_uploaded: ${{ steps.keep_candidate.outcome }}
      # Opt-in auto-approval results, for your own notifications (docs/auto-approval.md).
      auto_approval: ${{ steps.review.outputs.auto_approval }}
      auto_approval_reasons: ${{ steps.review.outputs.auto_approval_reasons }}
      pr_url: ${{ steps.review.outputs.pr_url }}
    steps:
      - name: Check LLM API key
        id: llm_key
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::LLM_API_KEY is not configured - skipping Cururu review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch analyzer evidence
        # Downloads the manifest from the unprivileged Analyzers run for this
        # head as data. Without a finished run, records the tools as not run.
        timeout-minutes: 13
        if: steps.llm_key.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          head="$EVENT_HEAD"
          if [ -z "$head" ]; then
            head="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"
          fi
          mkdir -p artifacts
          status=""
          # 12 minutes: longer than the Analyzers job timeout (10) plus queueing.
          for _ in $(seq 1 48); do
            run="$(gh api "repos/$REPO/actions/workflows/analyzers.yml/runs?head_sha=$head&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.id) \(.status) \(.conclusion)"' 2>/dev/null || true)"
            if [ -n "$run" ]; then
              read -r run_id status conclusion <<< "$run"
            fi
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 15
          done
          if [ "$status" = "completed" ] && gh run download "$run_id" -R "$REPO" -n analysis -D artifacts; then
            echo "Analyzer evidence from run $run_id ($conclusion)."
          else
            echo "::warning::No finished Analyzers run for $head; recording the tools as not run."
            HEAD="$head" python3 - <<'PY'
          import json, os
          tools = [{"name": name, "status": "not_run", "exit_code": None,
                    "message": "Analyzers workflow did not finish for this head"}
                   for name in ("cargo-check", "cargo-clippy")]
          with open("artifacts/analysis.json", "w") as f:
              json.dump({"schema_version": 1, "commit_sha": os.environ["HEAD"], "tools": tools}, f, indent=2)
          PY
          fi
      - name: Review PR
        id: review
        if: steps.llm_key.outputs.skip == 'false'
        uses: lucaswilliameufrasio/cururu@903862aebcbf84ed96817bae691539002a382c61 # v6.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          expected_head_sha: ${{ github.event.pull_request.head.sha || '' }}
          cururu_language: pt-BR
          cururu_profile: balanced
          cururu_fail_on: off
      - name: Keep candidate for the publish job
        id: keep_candidate
        if: ${{ !cancelled() && steps.review.outputs.review_status == 'pending_approval' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cururu-candidate
          path: cururu-candidate.json
          retention-days: 7

  publish:
    needs: review
    # !cancelled() keeps a candidate publishable when the review job fails only
    # on the configured quality gate; the candidate must have been stored.
    if: >-
      ${{ !cancelled() &&
          needs.review.outputs.review_status == 'pending_approval' &&
          needs.review.outputs.candidate_uploaded == 'success' }}
    # Required reviewers on this environment approve the exact candidate.
    environment: cururu-publish
    # A newer review supersedes a publication still waiting for approval.
    concurrency:
      group: cururu-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cururu-candidate
      - name: Publish approved review
        uses: lucaswilliameufrasio/cururu@903862aebcbf84ed96817bae691539002a382c61 # v6.3.0
        with:
          mode: publish
          github_token: ${{ secrets.GITHUB_TOKEN }}
          candidate_digest: ${{ needs.review.outputs.candidate_digest }}
