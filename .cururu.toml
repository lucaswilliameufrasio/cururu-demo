version = 1

[provider]
name = "openrouter"
model = "openai/gpt-5.6-luna"

[review]
max_diff_bytes = 50000
chunk_bytes = 15000
ignore = ["**/Cargo.lock"]
language = "pt-BR"
comment_mode = "inline"

[context]
conventions = ["CONTRIBUTING.md"]
max_bytes = 10000

[summary]
show_cost = true
show_usage = true
