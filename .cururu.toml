version = 1

# Shared base on a branch (resolved to one commit per run). Cururu
# recommends a full commit SHA; this demo follows main to exercise branches.
[config]
base = "lucaswilliameufrasio/cururu-demo"
base_ref = "main"
base_path = "configs/cururu/base.toml"

[provider]
name = "openrouter"
model = "openai/gpt-6-luna"

[review]
max_diff_bytes = 50000
chunk_bytes = 15000
ignore = ["**/Cargo.lock"]
language = "pt-BR"
comment_mode = "inline"
# Opt in to one extra LLM recommendation when a review response hits its output
# limit. This can incur additional provider cost. Keep disabled in the showcase.
recommendations = false
profile = "balanced"

[policy]
minimum_confidence = 0.65
max_findings = 30
fail_on = "off"
allowed_severities = ["critical", "high", "medium", "low"]
suggested_changes = false
incremental = false
synthesis = true
focus = []

[context]
conventions = ["CONTRIBUTING.md"]
max_bytes = 10000

[context.auto]
enabled = false
max_bytes = 50000
max_files = 20
per_file_bytes = 12000
include = ["src/**", "tests/**"]
exclude = ["**/generated/**", "**/*.min.js"]

[analysis]
enabled = true
manifest = "artifacts/analysis.json"
max_findings = 100
require_current_head = true
check_runs = true
check_run_names = []
